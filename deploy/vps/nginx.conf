# :443 SNI passthrough (no TLS termination here). <base sslip host> -> stream-relay (own LE cert via
# TLS-ALPN-01); everything else -> Caddy (echo.* + control.*, own LE certs via TLS-ALPN-01).
worker_processes 1;
events { worker_connections 1024; }
stream {
  # ACME TLS-ALPN-01 for every name (incl. the relay host) goes to Caddy, which holds all certs;
  # the relay reads its cert from Caddy's store (manual mode, restarted weekly by cron).
  map "$ssl_preread_server_name|$ssl_preread_alpn_protocols" $up {
    "~^[^|]*\|acme-tls/1$"   127.0.0.1:9443;
    "~^${RELAY_HOST_RE}\|"   127.0.0.1:8443;
    default                  127.0.0.1:9443;
  }
  server {
    listen ${PUBLIC_BIND}:443;
    ssl_preread on;
    proxy_pass $up;
    proxy_connect_timeout 5s;
    proxy_timeout 10m;
  }
}
