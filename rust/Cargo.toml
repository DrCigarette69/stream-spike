[workspace]
resolver = "2"
members = [
  "crates/stream-proto",
  "crates/stream-peer",
  "crates/stream-gateway",
  "crates/stream-relay",
]

[workspace.dependencies]
# Alpha-3 (A3.1/A3.2): real iroh endpoint, opt-in only. default-features off;
# relays/discovery are disabled in code. Needs RustCrypto rc pins (see pin-msrv-deps.sh).
iroh = { version = "=0.95.1", default-features = false }
# A4.2 self-hosted relay (Platform): server lib/bin, same 0.95.1 that iroh/test-utils already pulls.
# Used only by stream-relay behind its `server` feature; the default build does not compile it.
iroh-relay = { version = "=0.95.1", default-features = false, features = ["server"] }

# A4.2: iroh 0.95.1 with one patch: no call-me-maybe in PathSelection::RelayOnly
# (vendor/iroh/STREAM_PATCH.md). Same version, so Cargo.lock only changes its source.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
