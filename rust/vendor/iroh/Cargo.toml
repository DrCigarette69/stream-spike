[package]
edition = "2024"
rust-version = "1.85"
name = "iroh"
version = "0.95.1"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "n0 team",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "p2p quic connections dialed by public key"
readme = "README.md"
keywords = [
    "quic",
    "networking",
    "holepunching",
    "p2p",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "iroh_docsrs",
]

[features]
default = ["metrics"]
discovery-local-network = ["dep:swarm-discovery"]
discovery-pkarr-dht = ["pkarr/dht"]
metrics = [
    "iroh-metrics/metrics",
    "iroh-relay/metrics",
    "portmapper/metrics",
]
test-utils = [
    "iroh-relay/test-utils",
    "iroh-relay/server",
    "dep:axum",
]

[lib]
name = "iroh"
crate-type = [
    "lib",
    "cdylib",
]
path = "src/lib.rs"

[[example]]
name = "0rtt"
path = "examples/0rtt.rs"
required-features = []

[[example]]
name = "connect"
path = "examples/connect.rs"
required-features = []

[[example]]
name = "connect-unreliable"
path = "examples/connect-unreliable.rs"
required-features = []

[[example]]
name = "dht_discovery"
path = "examples/dht_discovery.rs"
required-features = ["discovery-pkarr-dht"]

[[example]]
name = "echo"
path = "examples/echo.rs"
required-features = []

[[example]]
name = "echo-no-router"
path = "examples/echo-no-router.rs"
required-features = []

[[example]]
name = "listen"
path = "examples/listen.rs"
required-features = []

[[example]]
name = "listen-unreliable"
path = "examples/listen-unreliable.rs"
required-features = []

[[example]]
name = "locally-discovered-nodes"
path = "examples/locally-discovered-nodes.rs"
required-features = ["discovery-local-network"]

[[example]]
name = "screening-connection"
path = "examples/screening-connection.rs"

[[example]]
name = "search"
path = "examples/search.rs"
required-features = []

[[example]]
name = "transfer"
path = "examples/transfer.rs"
required-features = []

[[test]]
name = "integration"
path = "tests/integration.rs"

