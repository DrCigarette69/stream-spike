[package]
name = "stream-gateway"
version = "0.1.0"
edition = "2021"
description = "Stream Gateway (Rust) — denylist, fake relay, AUTH_TICKET, metering"

[[bin]]
name = "stream-gateway"
path = "src/main.rs"

[dependencies]
stream-proto = { path = "../stream-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "=0.7.9"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
iroh = { workspace = true, optional = true }

[[example]]
name = "print_dev_endpoint_id"
required-features = ["iroh"]

[[example]]
name = "a31_test_client"
required-features = ["iroh"]

[features]
default = []
# Alpha-3: opt-in real iroh endpoint (SPIKE_TRANSPORT=iroh_local). Not in default build.
iroh = ["dep:iroh"]
