[package]
name = "stream-peer"
version = "0.1.0"
edition = "2021"
description = "Stream Peer agent (Rust) — ISP ack, egress floor, kill, AUTH_TICKET"

[[bin]]
name = "stream-peer"
path = "src/main.rs"

[dependencies]
stream-proto = { path = "../stream-proto" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "=0.7.9"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"
iroh = { workspace = true, optional = true }

[features]
default = []
# Alpha-3: opt-in real iroh endpoint (SPIKE_TRANSPORT=iroh_local). Not in default build.
iroh_local = ["dep:iroh"]
# Alpha-4: iroh_pilot = iroh_local + iroh test-utils (Builder::path_selection(PathSelection::RelayOnly)).
iroh_pilot = ["iroh_local", "iroh/test-utils"]
# Alpha-4 on-box lane only (dev relay URL, TEST-NET egress); never in the pilot package.
a4_local = ["stream-proto/a4_local"]
